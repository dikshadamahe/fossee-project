# =============================================================================
# API SPECIFICATION - Chemical Equipment Parameter Visualizer
# FOSSEE Scientific Analytics
# =============================================================================
#
# This document defines the centralized API specification used by:
#   - Django Backend:    /backend/api/views.py
#   - React Frontend:    /web-frontend/src/api/client.js (axios)
#   - PyQt5 Desktop:     /desktop-app/api_client.py (requests)
#
# Base URL: http://localhost:8000
# API Prefix: /api
#
# =============================================================================


# =============================================================================
# ENDPOINTS
# =============================================================================

ENDPOINTS:

  UPLOAD:
    path: /api/upload/
    method: POST
    content-type: multipart/form-data
    request:
      file: binary (required) - CSV file
      filename: string (optional) - Custom name
    response: UploadResponse
    
  DATASETS_LIST:
    path: /api/datasets/
    method: GET
    response: DatasetListItem[]
    
  DATASET_DETAIL:
    path: /api/datasets/{id}/
    method: GET
    response: DatasetDetail
    
  DATASET_DELETE:
    path: /api/datasets/{id}/
    method: DELETE
    response: 204 No Content
    
  SUMMARY:
    path: /api/summary/{id}/
    method: GET
    response: SummaryResponse
    
  REPORT:
    path: /api/report/{id}/
    method: GET
    response: application/pdf (binary)


# =============================================================================
# RESPONSE TYPES
# =============================================================================

TYPES:

  UploadResponse:
    success: boolean
    dataset_id: integer
    message: string
    summary: SummaryResponse
    
  SummaryResponse:
    total_count: integer
    avg_flowrate: float
    avg_pressure: float
    avg_temperature: float
    type_distribution: object  # {"Pump": 5, "Valve": 3, ...}
    
  DatasetListItem:
    id: integer
    filename: string
    record_count: integer
    uploaded_at: string (ISO 8601 datetime)
    
  DatasetDetail:
    id: integer
    filename: string
    uploaded_at: string (ISO 8601 datetime)
    records: EquipmentRecord[]
    
  EquipmentRecord:
    id: integer
    equipment_name: string
    equipment_type: string
    flowrate: float
    pressure: float
    temperature: float
    
  ErrorResponse:
    error: string
    details: string[]


# =============================================================================
# REQUIRED CSV COLUMNS
# =============================================================================

CSV_COLUMNS:
  required:
    - Equipment Name (or: equipment_name, name)
    - Type (or: equipment_type)
    - Flowrate (or: flow_rate, flow)
    - Pressure (or: press)
    - Temperature (or: temp)


# =============================================================================
# CLIENT IMPLEMENTATIONS
# =============================================================================

REACT_AXIOS:
  file: /web-frontend/src/api/client.js
  import: |
    import apiClient, { Endpoints, saveReport } from './api/client';
  usage: |
    // Upload
    const result = await apiClient.upload(file);
    
    // Get summary
    const summary = await apiClient.getSummary(datasetId);
    
    // List datasets
    const datasets = await apiClient.getDatasets();
    
    // Download report
    await saveReport(datasetId, 'equipment_report.pdf');

PYQT_REQUESTS:
  file: /desktop-app/api_client.py
  import: |
    from api_client import get_client, Endpoints
  usage: |
    client = get_client()
    
    # Upload
    result = client.upload('/path/to/file.csv')
    
    # Get summary
    result = client.get_summary(dataset_id)
    
    # List datasets
    result = client.get_datasets()
    
    # Download report
    result = client.download_report(dataset_id, 'report.pdf')
